{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-gcpsm
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.secretStore.projectID | quote }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name | default (printf "%s-sa" (include "k8s-mlops.fullname" .)) }}
      {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-external-secrets
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "k8s-mlops.fullname" . }}-gcpsm
    kind: SecretStore
  target:
    name: {{ include "k8s-mlops.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: '{{ "{{ .postgres_user }}" }}'
        POSTGRES_PASSWORD: '{{ "{{ .postgres_password }}" }}'
        POSTGRES_MLOPS_URL: 'postgresql://{{ "{{ .postgres_user }}" }}:{{ "{{ .postgres_password }}" }}@127.0.0.1:5432/mlops'
        POSTGRES_MLFLOW_URL: 'postgresql://{{ "{{ .postgres_user }}" }}:{{ "{{ .postgres_password }}" }}@127.0.0.1:5432/mlflow'
        POSTGRES_OPTUNA_URL: 'postgresql://{{ "{{ .postgres_user }}" }}:{{ "{{ .postgres_password }}" }}@127.0.0.1:5432/optuna'
        WEBHOOK_TOKEN: '{{ "{{ .webhook_token }}" }}'
        WEBHOOK_SECRET_TOKEN: '{{ "{{ .webhook_token }}" }}'
        AWS_ACCESS_KEY_ID: ""
        AWS_SECRET_ACCESS_KEY: ""
        S3_ACCESS_KEY: ""
        S3_SECRET_KEY: ""
  data:
    - secretKey: postgres_user
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecrets.postgresUserKey | default "mlops-db-user" }}
    - secretKey: postgres_password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecrets.postgresPasswordKey | default "mlops-db-password" }}
    - secretKey: webhook_token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecrets.webhookTokenKey | default "mlops-webhook-token" }}
{{- end }}
