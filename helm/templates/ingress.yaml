{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-ingress
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ printf "%s-%s" (include "k8s-mlops.fullname" $) .service }}
                port:
                  number: {{ if eq .service "streamlit" }}{{ $.Values.streamlit.service.port }}{{ else if eq .service "serving" }}{{ $.Values.serving.service.port }}{{ else if eq .service "mlflow" }}{{ $.Values.mlflow.service.port }}{{ else }}80{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
