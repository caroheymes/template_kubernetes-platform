{{- if .Values.streamlit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-streamlit
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: streamlit
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.streamlit.service.port }}
      targetPort: {{ .Values.streamlit.service.targetPort }}
      name: http
  selector:
    {{- include "k8s-mlops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: streamlit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-streamlit
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: streamlit
spec:
  replicas: {{ .Values.streamlit.replicas }}
  selector:
    matchLabels:
      {{- include "k8s-mlops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: streamlit
  template:
    metadata:
      labels:
        {{- include "k8s-mlops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: streamlit
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-sa" (include "k8s-mlops.fullname" .)) }}
      {{- end }}
      containers:
        - name: streamlit
          image: "{{ .Values.streamlit.image.repository }}:{{ .Values.streamlit.image.tag }}"
          imagePullPolicy: {{ .Values.streamlit.image.pullPolicy }}
          ports:
            - containerPort: 8503
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "k8s-mlops.fullname" . }}-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_MLOPS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: POSTGRES_MLOPS_URL
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: WEBHOOK_TOKEN
            - name: WEBHOOK_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: WEBHOOK_SECRET_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: S3_ACCESS_KEY
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: S3_SECRET_KEY
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          resources:
            {{- toYaml .Values.streamlit.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8503
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8503
            initialDelaySeconds: 15
            periodSeconds: 10
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: "{{ .Values.cloudSqlProxy.image }}"
          imagePullPolicy: {{ .Values.cloudSqlProxy.pullPolicy }}
          args:
            {{- if .Values.cloudSqlProxy.privateIp }}
            - "--private-ip"
            {{- end }}
            - "--structured-logs"
            - "--port={{ .Values.cloudSqlProxy.port | default 5432 }}"
            - "{{ .Values.cloudSqlProxy.instanceConnectionName }}"
          securityContext:
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.cloudSqlProxy.resources | nindent 12 }}
        {{- end }}
{{- end }}
