{{- if .Values.mlflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-mlflow
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracking
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mlflow.service.port }}
      targetPort: 5000
      name: http
  selector:
    {{- include "k8s-mlops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tracking
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-mlflow
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracking
spec:
  replicas: {{ .Values.mlflow.replicas }}
  selector:
    matchLabels:
      {{- include "k8s-mlops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tracking
  template:
    metadata:
      labels:
        {{- include "k8s-mlops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tracking
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-sa" (include "k8s-mlops.fullname" .)) }}
      {{- end }}
      containers:
        - name: mlflow
          image: "{{ .Values.mlflow.image }}"
          imagePullPolicy: {{ .Values.mlflow.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              (python -c "import psycopg2, boto3, google.cloud.storage" 2>/dev/null || pip install --no-cache-dir psycopg2-binary boto3 google-cloud-storage) && \
              mlflow server \
                --backend-store-uri $POSTGRES_MLFLOW_URL \
                --default-artifact-root $DEFAULT_ARTIFACT_ROOT \
                --host 0.0.0.0 \
                --port 5000
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: POSTGRES_MLFLOW_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: POSTGRES_MLFLOW_URL
            - name: DEFAULT_ARTIFACT_ROOT
              value: {{ .Values.mlflow.artifactRoot | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-mlops.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          resources:
            {{- toYaml .Values.mlflow.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 40
            periodSeconds: 20
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: "{{ .Values.cloudSqlProxy.image }}"
          imagePullPolicy: {{ .Values.cloudSqlProxy.pullPolicy }}
          args:
            {{- if .Values.cloudSqlProxy.privateIp }}
            - "--private-ip"
            {{- end }}
            - "--structured-logs"
            - "--port={{ .Values.cloudSqlProxy.port | default 5432 }}"
            - "{{ .Values.cloudSqlProxy.instanceConnectionName }}"
          securityContext:
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.cloudSqlProxy.resources | nindent 12 }}
        {{- end }}
{{- end }}
