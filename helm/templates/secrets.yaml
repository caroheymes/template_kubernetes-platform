{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-secrets
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.auth.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | b64enc | quote }}
  {{- $dbHost := ternary "127.0.0.1" (printf "%s-postgres" (include "k8s-mlops.fullname" .)) .Values.cloudSqlProxy.enabled }}
  {{- $dbPort := ternary (default 5432 .Values.cloudSqlProxy.port) .Values.postgres.service.port .Values.cloudSqlProxy.enabled }}
  POSTGRES_MLOPS_URL: {{ printf "postgresql://%s:%s@%s:%v/mlops" .Values.postgres.auth.user .Values.postgres.auth.password $dbHost $dbPort | b64enc | quote }}
  POSTGRES_MLFLOW_URL: {{ printf "postgresql://%s:%s@%s:%v/mlflow" .Values.postgres.auth.user .Values.postgres.auth.password $dbHost $dbPort | b64enc | quote }}
  POSTGRES_OPTUNA_URL: {{ printf "postgresql://%s:%s@%s:%v/optuna" .Values.postgres.auth.user .Values.postgres.auth.password $dbHost $dbPort | b64enc | quote }}
  WEBHOOK_TOKEN: {{ .Values.serving.webhookToken | b64enc | quote }}
  WEBHOOK_SECRET_TOKEN: {{ .Values.serving.webhookToken | b64enc | quote }}
  S3_ACCESS_KEY: {{ "minioadmin" | b64enc | quote }}
  S3_SECRET_KEY: {{ "minioadminpassword" | b64enc | quote }}
  AWS_ACCESS_KEY_ID: {{ "minioadmin" | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ "minioadminpassword" | b64enc | quote }}
{{- end }}
