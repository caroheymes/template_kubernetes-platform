apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-mlops.fullname" . }}-secrets
  labels:
    {{- include "k8s-mlops.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.auth.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | b64enc | quote }}
  POSTGRES_MLOPS_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/mlops" .Values.postgres.auth.user .Values.postgres.auth.password (include "k8s-mlops.fullname" .) | b64enc | quote }}
  POSTGRES_MLFLOW_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/mlflow" .Values.postgres.auth.user .Values.postgres.auth.password (include "k8s-mlops.fullname" .) | b64enc | quote }}
  POSTGRES_OPTUNA_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/optuna" .Values.postgres.auth.user .Values.postgres.auth.password (include "k8s-mlops.fullname" .) | b64enc | quote }}
  WEBHOOK_TOKEN: {{ .Values.serving.webhookToken | b64enc | quote }}
  WEBHOOK_SECRET_TOKEN: {{ .Values.serving.webhookToken | b64enc | quote }}
  S3_ACCESS_KEY: {{ "minioadmin" | b64enc | quote }}
  S3_SECRET_KEY: {{ "minioadminpassword" | b64enc | quote }}
  AWS_ACCESS_KEY_ID: {{ "minioadmin" | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ "minioadminpassword" | b64enc | quote }}
