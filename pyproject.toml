[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s_mlops_platform"
version = "1.0.0"
description = "Cloud-Native MLOps Platform Template for Kubernetes"
authors = [{ name = "MLOps Architect" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "xgboost>=2.0.0",
    "shapash>=2.4.0",
    "optuna>=3.6.0",
    "mlflow>=2.11.0",
    "evidently>=0.4.15",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
