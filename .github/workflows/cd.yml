name: CD Pipeline - Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/serving
            ghcr.io/${{ github.repository }}/app

      - name: Build Serving Image (Local Dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serving
          push: false
          tags: mlops-serving:latest

      - name: Build App Image (Local Dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.app
          push: false
          tags: mlops-app:latest

  helm-dryrun:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Template Dry-Run
        run: |
          helm template mlops-release helm/ --debug
